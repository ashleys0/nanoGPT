hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ep${ep_num}_lr${learning_rate}_muon${muon_lr}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - n_shards=99
    - max_iters=10000
    - learning_rate=1e-2
    - muon_lr=1e-3
  job:
    name: train
    chdir: false
    override_dirname: learning_rate=1e-2,max_iters=10000,muon_lr=1e-3,n_shards=99
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /data2/ash/251B/nanogpt1/gpt_hydra
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data2/ash/251B/nanogpt1/gpt_hydra/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
ep_offset: 15
ep_num: ${add:${hydra:job.num},${ep_offset}}
out_dir: ckpt/ep_${ep_num}
eval_interval: 200
log_interval: 200
eval_iters: 200
eval_only: false
always_save_checkpoint: false
save_interval: 2000
init_from: scratch
patience: 3
wandb_log: true
wandb_project: 251B_nanoGPT_hydra
wandb_run_name: gpt_muon_ep_${ep_num}_lr=${learning_rate}_muon_lr=${muon_lr}
wandb_group: lr_muonlr_sweep
n_shards: 99
gradient_accumulation_steps: 30
batch_size: 32
block_size: 1024
n_layer: 9
n_head: 12
n_embd: 768
mlp_hidden: 2816
dropout: 0.0
bias: false
learning_rate: 0.01
muon_lr: 0.001
muon_momentum: 0.95
max_iters: 10000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
decay_lr: true
warmup_iters: 100
lr_decay_iters: ${max_iters}
min_lr: 6.0e-05
backend: nccl
device: cuda
dtype: bfloat16
compile: true
