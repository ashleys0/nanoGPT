ep_offset: 0
ep_num: 16
out_dir: ckpt/ep_${ep_num}
eval_interval: 200
log_interval: 200
eval_iters: 200
eval_only: false
always_save_checkpoint: false
save_interval: 2000
init_from: resume
ckpt_load_path: ckpt/ep_15/ckpt_8000.pt
patience: 20
wandb_log: true
wandb_project: 251B_nanoGPT_hydra
wandb_run_name: gpt_muon_ep_${ep_num}_lr=${learning_rate}_muon_lr=${muon_lr}
wandb_group: lr_muonlr_sweep
n_shards: 99
gradient_accumulation_steps: 30
batch_size: 32
block_size: 1024
n_layer: 9
n_head: 12
n_embd: 768
mlp_hidden: 2816
dropout: 0.0
bias: false
learning_rate: 0.001
muon_lr: 0.0001
muon_momentum: 0.95
max_iters: 30000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
decay_lr: true
warmup_iters: 500
lr_decay_iters: 35000
min_lr: none
backend: nccl
device: cuda
dtype: bfloat16
compile: true
